[package]
name = "shell-history-nucleo"
description = "A fork of helix-editor/nucleo with filtering and custom scoring for shell-history"
authors = ["Pascal Kuthe <pascalkuthe@pm.me>", "Michelle Tilley <michelle@console.sh>"]
version = "0.6.0"
edition = "2021"
license = "MPL-2.0"
repository = "console"
exclude = ["/typos.toml", "/tarpaulin.toml"]

[lib]

[dependencies]
shell-history-nucleo-matcher = { version = "0.3.1", path = "matcher" }
parking_lot = { version = "0.12.1", features = ["send_guard", "arc_lock"] }
rayon = "1.7.0"
