[metadata]
name = "run-styles"
description = "Pick the active theme"

[source]
command = "run-style list"
no_sort = true

[preview]
cached = false
command = "run-style preview \"{}\""

[keybindings]
enter = "actions:pick"

[actions.pick]
description = "make the chosen theme active"
command = "run-style set {}"
shell = "bash"
mode = "execute"
