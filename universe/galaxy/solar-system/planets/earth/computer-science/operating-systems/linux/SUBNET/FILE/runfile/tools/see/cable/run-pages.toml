[metadata]
name = "run-pages"
description = "Pick an .run page"

[source]
command = '''print (glob **/*.run | where {|p| not ($p | str contains "/target/") and not ($p | str contains "/.git/")} | sort | str join "\n")'''
display = "{split:/:-1}"
output = "{}"

[preview]
cached = false
command = "bash ($env.SUBNET_RUNFILE_ROOT | path join tools see preview-fit.sh) '{}' --contracts"

[keybindings]
enter = "actions:pick"

[actions.pick]
description = "write the chosen page to /tmp/run-pick"
command = "printf '%s' '{}' > /tmp/run-pick"
shell = "bash"
mode = "execute"
