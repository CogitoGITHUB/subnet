# .github/workflows/git-secrets-rotate.yml
name: GitSecrets Rotate
on:
  push:
    paths:
      - ".git-secrets/recipients/**"
    branches:
      - main
permissions:
  contents: write
jobs:
  rotate-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Rotate secrets
        env:
          GIT_SECRETS_IDENTITY: ${{ secrets.GIT_SECRETS_IDENTITY }}
        run: docker run --rm -v "${{ github.workspace }}:/app" -e GIT_SECRETS_IDENTITY ghcr.io/sayanarijit/cottage rotate
      - name: Commit and push
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          if git commit -am "git-secrets: auto rotate secrets"; then
            git push origin HEAD:main
          fi
