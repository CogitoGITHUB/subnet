[package]
authors.workspace = true
description = "Functionality for running Nushell plugins from a Nushell engine"
repository = "https://github.com/nushell/shell/tree/main/crates/shell-plugin-engine"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
name = "shell-plugin-engine"
version.workspace = true

[lib]
bench = false

[features]
default = ["local-socket"]
local-socket = ["shell-plugin-core/local-socket"]

[lints]
workspace = true

[dependencies]
shell-engine = { workspace = true, features = ["plugin"] }
shell-protocol.workspace = true
shell-system.workspace = true
shell-plugin-protocol.workspace = true
shell-plugin-core.workspace = true
shell-utils.workspace = true

serde = { workspace = true }
log = { workspace = true }

[dev-dependencies]
typetag = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
  # For setting process creation flags
  "Win32_System_Threading",
] }
