[metadata]
name = "jump"
description = "Browse the jump directory history"
requirements = ["console"]

[source]
command = "console jump query -l"
no_sort = true
frecency = false
display = "{split:/:-1}"

[preview]
command = "ls --short-names -la \"{}\" | table | ansi strip"

[keybindings]
ctrl-d = "actions:remove"

[actions.cd]
description = "Change to the selected directory"
command = "cd {} && $SHELL"
mode = "execute"

[actions.remove]
description = "Remove the selected directory from jump"
command = "console jump remove {}"
mode = "fork"

[ui.preview_panel]
size = 80
