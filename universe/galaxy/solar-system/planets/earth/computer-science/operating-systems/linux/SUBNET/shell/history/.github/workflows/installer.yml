name: Install

on:
  push:
    branches: [main]
  pull_request:
    paths: .github/workflows/installer.yml

env:
  CARGO_TERM_COLOR: always

jobs:
  install:
    strategy:
      matrix:
        os: [depot-ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Install zsh for ubuntu
        if: matrix.os == 'depot-ubuntu-24.04' 
        run: | 
          sudo apt install zsh

      - name: Test install script on bash
        run: | 
          /bin/bash -c "$(curl --proto '=https' --tlsv1.2 -sSf https://setup.atuin.sh)"
          [ -d "$HOME/.shell-history" ] && source $HOME/.shell-history/bin/env
          shell-history --help

      - name: Test install script on zsh
        shell: zsh {0}
        run: | 
          /bin/bash -c "$(curl --proto '=https' --tlsv1.2 -sSf https://setup.atuin.sh)"
          [ -d "$HOME/.shell-history" ] && source $HOME/.shell-history/bin/env
          shell-history --help
