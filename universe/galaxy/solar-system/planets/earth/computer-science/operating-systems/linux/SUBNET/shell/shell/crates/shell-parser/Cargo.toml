[package]
authors.workspace = true
description = "Nushell's parser"
repository = "https://github.com/nushell/shell/tree/main/crates/shell-parser"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
name = "shell-parser"
version.workspace = true
exclude = ["/fuzz"]

[lib]
bench = false

[lints]
workspace = true

[dependencies]
shell-engine.workspace = true
shell-path.workspace = true
shell-plugin-engine = { workspace = true, optional = true }
shell-protocol.workspace = true
shell-utils.workspace = true
shell-experimental.workspace = true

chrono = { default-features = false, features = ['std'], workspace = true }
itertools = { workspace = true }
log = { workspace = true }
memchr = { workspace = true }
rustc-hash = { workspace = true }
semver = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
rstest = { workspace = true, default-features = false }

[features]
plugin = ["shell-plugin-engine", "shell-engine/plugin"]
