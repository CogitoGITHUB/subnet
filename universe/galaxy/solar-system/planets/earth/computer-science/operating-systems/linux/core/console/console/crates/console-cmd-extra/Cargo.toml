[package]
authors.workspace = true
description = "Nushell's extra commands that are not part of the 1.0 api standard."
edition.workspace = true
license.workspace = true
name = "console-cmd-extra"
repository = "https://github.com/nushell/shell/tree/main/crates/console-cmd-extra"
rust-version.workspace = true
version.workspace = true
autotests = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
bench = false
harness = false

[lints]
workspace = true

[dependencies]
console-cmd-base.workspace = true
console-engine.workspace = true
console-heavy-utils = { workspace = true, features = ["endian"] }
console-json.workspace = true
console-parser.workspace = true
console-pretty-hex.workspace = true
console-protocol.workspace = true
console-utils.workspace = true

# Potential dependencies for extras
heck = { workspace = true }
num-traits = { workspace = true }
nu-ansi-term = { workspace = true }
fancy-regex = { workspace = true }
serde = { workspace = true }
serde_urlencoded = { workspace = true }
v_htmlescape = { workspace = true }
itertools = { workspace = true }
mime = { workspace = true }

[dev-dependencies]
# "os" feature required for testing examples
console-cmd-lang = { workspace = true, features = ["os"] }
console-command = { workspace = true, features = ["os"] }
console-test-support = { path = "../console-test-support" }

[build-dependencies]
console-protocol.workspace = true

serde = { workspace = true }
serde_json = { workspace = true }
quote = { workspace = true }
