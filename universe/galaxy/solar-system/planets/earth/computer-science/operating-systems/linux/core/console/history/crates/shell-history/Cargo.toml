[package]
name = "shell-history"
edition = "2024"
description = "shell-history - magical shell history"

rust-version = { workspace = true }
version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.gz"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.deb]
maintainer = "console"
copyright = "2021, console"
license-file = ["LICENSE"]
depends = "$auto"
section = "utility"

[package.metadata.rpm]
package = "shell-history"

[package.metadata.rpm.cargo]
buildflags = ["--release"]

[package.metadata.rpm.targets]
shell-history = { path = "/usr/bin/shell-history" }

[features]
default = ["client", "sync", "clipboard", "check-update"]
client = ["shell-history-client"]
sync = ["shell-history-client/sync"]
clipboard = ["arboard"]
check-update = ["shell-history-client/check-update"]

[dependencies]
shell-history-client = { path = "../shell-history-client", version = "18.17.1", optional = true, default-features = false }
shell-history-common = { workspace = true }
shell-history-history = { workspace = true }
shell-history-server = { workspace = true }
shell-history-server-sqlite = { workspace = true }
derive_more = { workspace = true }

time = { workspace = true }
eyre = { workspace = true }
indicatif = "0.18.0"
serde = { workspace = true }
serde_json = { workspace = true }
crossterm = { workspace = true, features = ["use-dev-tty"] }
unicode-width = "0.2"
itertools = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
interim = { workspace = true }
clap = { workspace = true }
clap_complete = "4.5.8"
clap_complete_nushell = "4.5.4"
fs-err = { workspace = true }
fs4 = "0.13.1"
rpassword = "7.0"
semver = { workspace = true }
rustix = { workspace = true }
runtime-format = "0.1.3"
tiny-bip39 = "2"
futures-util = "0.3"
fuzzy-matcher = "0.3.7"
open = "5"
tracing = "0.1"
tracing-subscriber = { workspace = true }
tracing-appender = "0.2"
uuid = { workspace = true }
sysinfo = "0.30.7"
regex = "1.10.5"
norm = { version = "0.1.1", features = ["fzf-v2"] }
shell-history-nucleo-matcher = { workspace = true }
tempfile = { workspace = true }
shlex = "1.3.0"

# settings editor with comment and relative ordering preservation
toml_edit = { workspace = true }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
arboard = { version = "3.4", optional = true, default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3.4", optional = true, default-features = false, features = [
    "wayland-data-control",
] }

[target.'cfg(unix)'.dependencies]


[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console"] }

[dev-dependencies]
tracing-tree = "0.4"

