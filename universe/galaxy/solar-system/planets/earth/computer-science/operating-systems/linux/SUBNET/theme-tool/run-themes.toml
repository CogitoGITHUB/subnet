[metadata]
name = "run-themes"
description = "Pick the active theme"

[source]
command = "run-theme list"
no_sort = true

[preview]
cached = false
command = "run-theme preview \"{}\""

[keybindings]
enter = "actions:pick"

[actions.pick]
description = "make the chosen theme active"
command = "run-theme set {}"
shell = "bash"
mode = "execute"
