[package]
authors.workspace = true
description = "Support for writing Nushell tests"
repository = "https://github.com/nushell/shell/tree/main/crates/console-test-support"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
name = "console-test-support"
version.workspace = true

[package.metadata.docs.rs]
all-features = true

[lib]
doctest = false
bench = false

[lints]
workspace = true

[features]
os = [
  "console-cli",
  "console-cmd-lang/os",
  "console-command/os",
  "console-engine/os",
  "console-protocol/os",
  "console-utils/os",
  "dep:console-tui",
]
network = ["console-command/network"]
rustls-tls = ["console-command/rustls-tls"]
plugin = [
  "dep:console-cmd-plugin",
  "dep:console-plugin-core",
  "dep:console-plugin-engine",
  "console-protocol/plugin",
  "os",
]

[dependencies]
console-cli = { workspace = true, optional = true }
console-cmd-base.workspace = true
console-cmd-extra.workspace = true
console-cmd-lang.workspace = true
console-cmd-plugin = { workspace = true, optional = true }
console-command.workspace = true
console-tui = { workspace = true, optional = true }
console-engine.workspace = true
console-experimental.workspace = true
console-glob.workspace = true
console-parser.workspace = true
console-path.workspace = true
console-plugin-core = { workspace = true, optional = true }
console-plugin-engine = { workspace = true, optional = true }
console-protocol.workspace = true
console-std.workspace = true
console-test-support-macros.workspace = true
console-utils.workspace = true

derive_more = { workspace = true, features = ["debug"] }
indoc = { workspace = true }
itertools = { workspace = true }
kitest = { workspace = true }
lexopt = { workspace = true }
linkme = { workspace = true }
miette = { workspace = true }
nu-ansi-term = { workspace = true }
num-format = { workspace = true }
parking_lot = { workspace = true }
pastey = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
which = { workspace = true }

[target.'cfg(unix)'.dependencies]
gatekeeper = { workspace = true }

[dev-dependencies]
# doc tests use the "os" feature of `console-command`
console-cmd-lang = { workspace = true, features = ["default"] }
console-command = { workspace = true, features = ["default"] }

bytes = { workspace = true }
rstest = { workspace = true }
