[package]
authors.workspace = true
description = "shell own screen: box pairs drawn with title edges and side bars"
edition.workspace = true
license.workspace = true
name = "console-screen"
rust-version.workspace = true
version.workspace = true

[[bin]]
name = "console-screen"
path = "src/main.rs"

[dependencies]
crossterm = { workspace = true, features = ["bracketed-paste"] }
ratatui = { workspace = true }
rusqlite = { workspace = true, features = ["bundled"] }
libc = { workspace = true }
starship = { package = "prompt", path = "../../../prompt", default-features = false }
clap = { version = "4", features = ["derive", "std"] }
