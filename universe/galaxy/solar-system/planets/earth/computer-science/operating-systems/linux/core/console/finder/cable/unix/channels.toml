[metadata]
name = "channels"
description = "Select a finder channel"
requirements = ["finder", "bat"]

[source]
command = ["finder list-channels"]

[preview]
command = "bat -pn --color=never ${FINDER_CONFIG:-${XDG_CONFIG_HOME:-$HOME/.config}/television}/cable/{}.toml"
shell = "bash"

[keybindings]
enter = "actions:channel-enter"

[actions.channel-enter]
description = "Enter a finder channel"
command = "finder {}"
mode = "execute"
